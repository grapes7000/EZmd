[project]
name = "ezmd"
version = "0.0.0"
description = "Fast, private native writing and notes app backed by portable Markdown files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.11,<7",
]

[project.scripts]
ezmd = "ezmd.app:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright",
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
qt_api = "pyside6"

[tool.coverage.run]
branch = true
source = ["ezmd"]

[tool.coverage.report]
show_missing = true
skip_covered = true
